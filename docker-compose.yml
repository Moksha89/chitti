services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      chitti_net:
        ipv4_address: 172.31.250.3

  litellm:
    image: ghcr.io/berriai/litellm:v1.80.0-stable.1
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      GLM_CODING_API_KEY: ${GLM_CODING_API_KEY}
      GLM_API_BASE: ${GLM_API_BASE:-https://api.z.ai/api/paas/v4}
      GLM_MODEL: ${GLM_MODEL:-glm-5.2}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      redis:
        condition: service_healthy
    networks:
      chitti_net:
        ipv4_address: 172.31.250.4

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      chitti_net:
        ipv4_address: 172.31.250.6

  chitti:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      CHITTI_PROVIDER: ${CHITTI_PROVIDER:-litellm}
      CHITTI_USERNAME: ${CHITTI_USERNAME:-akirah}
      CHITTI_PASSWORD_HASH: ${CHITTI_PASSWORD_HASH}
      CHITTI_SESSION_TTL_MINUTES: ${CHITTI_SESSION_TTL_MINUTES:-480}
      CHITTI_AUTH_STATE_PATH: ${CHITTI_AUTH_STATE_PATH:-/app/data/auth_state.json}
      CHITTI_TRUSTED_PROXY_IP: ${CHITTI_TRUSTED_PROXY_IP:-172.31.250.2}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ALLOWED_TELEGRAM_USER_IDS: ${ALLOWED_TELEGRAM_USER_IDS}
      PROFILE_PATH: ${PROFILE_PATH:-/app/profile/PROFILE.md}
      PROJECT_ROOT: ${PROJECT_ROOT:-/app/projects}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    ports:
      - "127.0.0.1:${CHITTI_PORT:-8000}:8000"
    volumes:
      - ./profile:/app/profile:ro
      - ./projects:/app/projects
      - chitti_state:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn chitti.main:app --host 0.0.0.0 --port 8000"]
    networks:
      chitti_net:
        ipv4_address: 172.31.250.5

  caddy:
    build:
      context: ./deploy/caddy
      dockerfile: Dockerfile
    image: chitti-caddy:2.9.1-ratelimit
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    expose:
      - "80"
      - "443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      chitti:
        condition: service_started
    networks:
      chitti_net:
        ipv4_address: 172.31.250.2

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  chitti_state:
networks:
  chitti_net:
    ipam:
      config:
        - subnet: 172.31.250.0/24
