model_list:
  - model_name: chitti-chat
    litellm_params:
      model: os.environ/GLM_LITELLM_MODEL
      api_base: os.environ/GLM_API_BASE
      api_key: os.environ/GLM_CODING_API_KEY
      max_budget: 25
      budget_duration: 1d
  - model_name: planner
    litellm_params:
      model: os.environ/GLM_LITELLM_MODEL
      api_base: os.environ/GLM_API_BASE
      api_key: os.environ/GLM_CODING_API_KEY
      max_budget: 25
      budget_duration: 1d
  - model_name: coder
    litellm_params:
      model: os.environ/GLM_LITELLM_MODEL
      api_base: os.environ/GLM_API_BASE
      api_key: os.environ/GLM_CODING_API_KEY
      max_budget: 2
      budget_duration: 1d
  - model_name: reviewer
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_base: https://api.deepseek.com
      api_key: os.environ/DEEPSEEK_API_KEY
      max_budget: 1
      budget_duration: 1d
  - model_name: bulk
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_base: https://api.deepseek.com
      api_key: os.environ/DEEPSEEK_API_KEY
      max_budget: 10
      budget_duration: 1d

litellm_settings:
  drop_params: true
  request_timeout: 120
  json_logs: true
  set_verbose: false
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD
    namespace: chitti-exact
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]
  max_budget: 35
  budget_duration: 1d

router_settings:
  routing_strategy: simple-shuffle
  provider_budget_config:
    openai:
      budget_limit: 25
      time_period: 1d
    deepseek:
      budget_limit: 10
      time_period: 1d

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  fail_closed_budget_enforcement: true
