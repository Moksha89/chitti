model_list:
  - model_name: chitti-chat
    litellm_params:
      model: os.environ/GLM_LITELLM_MODEL
      api_base: os.environ/GLM_API_BASE
      api_key: os.environ/GLM_CODING_API_KEY
      max_budget: 25
      budget_duration: 1d
  - model_name: planner
    litellm_params:
      model: os.environ/GLM_LITELLM_MODEL
      api_base: os.environ/GLM_API_BASE
      api_key: os.environ/GLM_CODING_API_KEY
      max_budget: 25
      budget_duration: 1d
  - model_name: coder
    litellm_params:
      model: os.environ/GLM_LITELLM_MODEL
      api_base: os.environ/GLM_API_BASE
      api_key: os.environ/GLM_CODING_API_KEY
      input_cost_per_token: 0.0000014
      output_cost_per_token: 0.0000044
      cache_read_input_token_cost: 0.00000026
      max_budget: 5
      budget_duration: 1d
  - model_name: coder-fallback
    litellm_params:
      model: glm-4.5
      api_base: os.environ/GLM_API_BASE
      api_key: os.environ/GLM_CODING_API_KEY
      input_cost_per_token: 0.0000014
      output_cost_per_token: 0.0000044
      cache_read_input_token_cost: 0.00000026
      max_budget: 5
      budget_duration: 1d
  - model_name: reviewer
    litellm_params:
      model: os.environ/GLM_LITELLM_MODEL
      api_base: os.environ/GLM_API_BASE
      api_key: os.environ/GLM_CODING_API_KEY
      max_budget: 1
      budget_duration: 1d
  - model_name: bulk
    litellm_params:
      model: os.environ/GLM_LITELLM_MODEL
      api_base: os.environ/GLM_API_BASE
      api_key: os.environ/GLM_CODING_API_KEY
      max_budget: 10
      budget_duration: 1d
  - model_name: vision
    litellm_params:
      model: openai/glm-4.6v-flashx
      api_base: os.environ/GLM_API_BASE
      api_key: os.environ/GLM_CODING_API_KEY
      input_cost_per_token: 0.00000004
      output_cost_per_token: 0.0000004
      max_budget: 1
      budget_duration: 1d
  - model_name: vision-fallback
    litellm_params:
      model: glm-4.6v-flashx
      api_base: os.environ/GLM_API_BASE
      api_key: os.environ/GLM_CODING_API_KEY
      input_cost_per_token: 0.00000004
      output_cost_per_token: 0.0000004
      max_budget: 1
      budget_duration: 1d

litellm_settings:
  drop_params: true
  request_timeout: 600
  # Chitti owns bounded retry classification and accounting per model call.
  num_retries: 0
  json_logs: true
  set_verbose: false
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD
    namespace: chitti-exact
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]
  max_budget: 35
  budget_duration: 1d

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - coder: [coder-fallback]
    - vision: [vision-fallback]
  provider_budget_config:
    openai:
      budget_limit: 25
      time_period: 1d
    deepseek:
      budget_limit: 10
      time_period: 1d

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  fail_closed_budget_enforcement: true
