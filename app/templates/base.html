<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chitti Mission Control{% endblock %}</title>
  <style>
    :root{color-scheme:dark;--bg:#080b10;--panel:#10151d;--line:#263241;--line-soft:#1b2531;--ink:#edf3f8;--muted:#8391a2;--faint:#5e6b7b;--accent:#6ee7c8;--accent-dim:#163c3b;--warning:#f4c97b;--danger:#ff8e8e;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
    *{box-sizing:border-box}html{background:var(--bg);overflow-x:hidden}body{min-width:0;margin:0;background:radial-gradient(circle at 76% -10%,#17302d44 0,transparent 32rem),var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
    button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.55}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.mono,code,pre,.eyebrow,.metric,.timestamp{font-family:var(--mono)}
    .shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;min-width:0}.sidebar,.main,.mission-grid,.rail,.panel{min-width:0}.sidebar{border-right:1px solid var(--line-soft);background:#0b0f15cc;padding:26px 18px;display:flex;flex-direction:column;gap:30px}.brand{display:flex;align-items:center;gap:11px}.brand-mark{display:grid;place-items:center;width:32px;height:32px;border:1px solid #6ee7c877;border-radius:8px;color:var(--accent);box-shadow:0 0 22px #6ee7c81c;font:700 13px var(--mono)}.brand-name{font-size:16px;font-weight:700;letter-spacing:.02em}.brand-sub{color:var(--faint);font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase}.nav-label,.eyebrow{color:var(--faint);font:10px var(--mono);letter-spacing:.15em;text-transform:uppercase}.nav{display:grid;gap:5px;min-width:0}.nav-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;border:1px solid transparent;border-radius:7px;color:var(--muted);min-width:0}.nav-item.active{border-color:#6ee7c833;background:#122422;color:var(--ink)}.nav-item:hover{border-color:var(--line);text-decoration:none}.nav-status{color:var(--accent);font-size:11px}.sidebar-foot{margin-top:auto;color:var(--faint);font:11px/1.6 var(--mono)}
    .main{min-width:0;padding:28px clamp(18px,4vw,54px) 52px}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:30px}.kicker{color:var(--accent);font:11px var(--mono);letter-spacing:.13em;text-transform:uppercase}h1,h2,h3,p{margin-top:0}h1{margin-bottom:5px;font-size:clamp(24px,3vw,34px);letter-spacing:-.035em;line-height:1.15}h2{margin-bottom:5px;font-size:16px;letter-spacing:-.01em}.subhead{margin:0;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:12px}.status-pill{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font:11px var(--mono)}.status-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}.icon-button,.button-secondary{border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--muted);padding:8px 11px}.icon-button:hover,.button-secondary:hover{border-color:#6ee7c866;color:var(--ink)}
    .mission-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.8fr);gap:18px;align-items:start}.panel{border:1px solid var(--line-soft);border-radius:11px;background:#10151df2;box-shadow:0 16px 42px #00000022}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line-soft)}.panel-title{display:flex;align-items:center;gap:10px}.panel-index,.panel-meta{color:var(--faint);font:11px var(--mono)}
    .transcript{min-height:250px;max-height:580px;overflow:auto;padding:20px}.transcript-empty{display:grid;min-height:210px;place-items:center;color:var(--muted);text-align:center}.transcript-empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}.suggestions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:18px}.suggestions button{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);padding:7px 10px;font:11px var(--mono)}.message{display:grid;grid-template-columns:30px minmax(0,1fr);gap:11px;margin-bottom:22px}.message-avatar{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;font:11px var(--mono)}.message-user .message-avatar{border:1px solid #526174;color:#bdc8d5}.message-assistant .message-avatar{border:1px solid #6ee7c877;background:var(--accent-dim);color:var(--accent)}.message-label{margin-bottom:5px;color:var(--faint);font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase}.message-body{color:#dbe4ec;overflow-wrap:anywhere}.message-user .message-body{color:var(--ink)}.message-body pre{overflow:auto;padding:13px 15px;border:1px solid var(--line);border-radius:7px;background:#090d12;color:#cce9df;font-size:12px}.message-body code{padding:2px 5px;border-radius:4px;background:#19222d;color:#cce9df;font-size:.9em}.message-body pre code{padding:0;background:transparent}
    .composer{padding:18px 20px 20px;border-top:1px solid var(--line-soft);background:#0d1219}.composer-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,160px) auto;align-items:end;gap:10px}.field{display:grid;gap:6px;min-width:0}.field label,label{color:var(--muted);font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.plan-toggle{display:flex;align-items:center;gap:6px;white-space:nowrap}.plan-toggle input{width:auto}input,textarea{width:100%;border:1px solid var(--line);border-radius:7px;outline:none;background:#0a0f15;color:var(--ink);padding:10px 11px}input:focus,textarea:focus{border-color:#6ee7c899;box-shadow:0 0 0 3px #6ee7c812}textarea{min-height:92px;max-height:260px;resize:vertical}.command-field,.project-field{min-width:0}.send-button,.primary-button{border:1px solid #6ee7c877;border-radius:7px;background:#173c38;color:var(--accent);padding:10px 16px;font-weight:700;white-space:nowrap}.composer-foot{display:flex;justify-content:space-between;gap:12px;margin-top:8px;color:var(--faint);font:10px var(--mono)}.thinking{color:var(--accent)}
    .rail{display:grid;gap:18px}.panel-body{padding:18px 20px}.belief{padding:13px 0;border-bottom:1px solid var(--line-soft)}.belief:first-child{padding-top:0}.belief:last-child{padding-bottom:0;border-bottom:0}.belief-value{margin:4px 0 8px;color:var(--ink)}.belief-meta{display:flex;flex-wrap:wrap;gap:7px;color:var(--faint);font:10px var(--mono);text-transform:uppercase}.tag,.forget-button{padding:3px 6px;border:1px solid var(--line);border-radius:4px}.forget-button{background:transparent;color:var(--faint);font:10px var(--mono);text-transform:uppercase}.forget-button:hover{border-color:var(--danger);color:var(--danger)}.conflict-panel{border-color:#6b4b2777;background:#17130cf2}.conflict-panel .panel-head{border-bottom-color:#6b4b274d}.conflict{padding:13px 0;border-bottom:1px solid #6b4b274d}.conflict:last-child{border-bottom:0;padding-bottom:0}.conflict-key{color:var(--warning);font:11px var(--mono);text-transform:uppercase}.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:11px 0}.compare-item{padding:9px;border:1px solid #6b4b274d;border-radius:6px;background:#201a10}.compare-label,.capability-status{color:var(--faint);font:10px var(--mono);text-transform:uppercase}.compare-value{margin-top:3px;color:#eadfc9;font-size:13px}.proposal-value{padding:7px 0;border-bottom:1px solid #6b4b274d}.proposal-value:last-child{border-bottom:0}.resolution-actions{display:flex;flex-wrap:wrap;gap:8px}.resolution-actions form{flex:1;min-width:130px}.resolution-actions button{width:100%;padding:8px 7px;font-size:12px}.reminder-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line-soft)}.reminder-row form{flex:0 0 auto}.empty-state{color:var(--muted)}.empty-state strong{display:block;margin-bottom:4px;color:var(--ink)}.capability-list{display:grid}.capability{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft);color:var(--muted);font-size:13px}
    .plan-summary{color:var(--muted)}.plan-memory{display:grid;gap:6px;margin:13px 0}.plan-tasks{display:grid;gap:10px;padding-left:22px}.plan-tasks li{display:grid;gap:3px;color:var(--muted)}.plan-tasks strong{color:var(--ink)}.plan-tasks small,.plan-tasks em,.plan-approval small{color:var(--faint);font:10px var(--mono)}.plan-tasks em{color:var(--warning);font-style:normal;text-transform:uppercase}.plan-approval{display:grid;gap:4px;margin-top:14px;padding:10px;border:1px solid #6ee7c844;border-radius:6px;color:var(--accent)}.plan-panel .resolution-actions{align-items:end}.plan-panel .resolution-actions input{min-width:0}.inline-action{display:inline-flex;width:max-content;text-decoration:none}.plan-page{max-width:1200px}.plan-hero{margin-bottom:18px}.plan-brief{max-width:760px;color:var(--muted);overflow-wrap:anywhere}.run-panel{margin-top:18px}.run-events,.artifact-list{display:grid;gap:8px;margin-bottom:16px}.run-events div,.artifact-list div{display:flex;justify-content:space-between;gap:12px;padding:9px;border:1px solid var(--line-soft);border-radius:6px;color:var(--muted)}.run-events strong{color:var(--accent);font:11px var(--mono);text-transform:uppercase}.operation{padding:10px 0;border-top:1px solid var(--line-soft)}.operation h3{font-size:13px}.operation pre{max-height:240px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}.artifact-list code{color:var(--faint);font:10px var(--mono)}
    .auth-shell{min-height:100vh;display:grid;place-items:center;padding:22px}.auth-card{width:min(100%,430px);padding:32px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 22px 70px #00000055}.auth-card h1{margin:8px 0}.auth-card .subhead{margin-bottom:25px}.auth-card form{display:grid;gap:15px}.auth-card button{width:100%;margin-top:5px}.error{padding:10px;border:1px solid #6e3030;border-radius:6px;color:var(--danger);background:#32191b}.requirements{margin:-4px 0 4px;padding-left:17px;color:var(--muted);font:12px/1.7 var(--mono)}.requirement.valid{color:var(--accent)}
    @media (max-width:1100px) and (min-width:901px){.composer-row{grid-template-columns:minmax(280px,1fr) minmax(0,130px)}.send-button{grid-column:1/-1;justify-self:end}}
    @media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}.sidebar{border-right:0;border-bottom:1px solid var(--line-soft);padding:15px 18px;gap:14px}.nav{display:flex;overflow-x:auto;max-width:100%}.nav-label,.sidebar-foot{display:none}.nav-item{flex:0 0 140px;min-width:0;overflow:hidden}.nav-item>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mission-grid{grid-template-columns:minmax(0,1fr)}.rail{grid-template-columns:repeat(2,minmax(0,1fr))}.rail .conflict-panel{grid-column:1/-1}}
    @media (max-width:600px){.main{padding:22px 12px 36px}.topbar{margin-bottom:22px}.status-pill{display:none}.rail{grid-template-columns:1fr}.composer-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.command-field{grid-column:1/-1}.send-button{align-self:end}.transcript{min-height:210px;padding:15px}.panel-head,.panel-body,.composer{padding-left:15px;padding-right:15px}.compare{grid-template-columns:1fr}.auth-card{padding:24px 20px}}
  </style>
</head>
<body>{% block body %}{% endblock %}</body>
</html>
